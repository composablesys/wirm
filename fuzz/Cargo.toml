[package]
name = "wirm-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
libfuzzer-sys = "0.4"
# wasm-smith releases in lockstep with wasmparser/wasm-encoder. When
# bumping wirm's wasmparser dep, bump this to match. See fuzz/DECISIONS.md.
wasm-smith = { version = "0.247.0", features = ["component-model"] }
wasm-encoder = "0.247.0"
wasmparser = "0.247.0"
# Used by `dwarf_invariant` to re-parse the encoded `.debug_line`. Tracks
# the wirm-level pin in the parent crate.
gimli = "0.33"

[dependencies.wirm]
path = ".."

[[bin]]
name = "module_roundtrip"
path = "fuzz_targets/module_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "module_instrument"
path = "fuzz_targets/module_instrument.rs"
test = false
doc = false
bench = false

[[bin]]
name = "component_roundtrip"
path = "fuzz_targets/component_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "component_instrument"
path = "fuzz_targets/component_instrument.rs"
test = false
doc = false
bench = false

[[bin]]
name = "component_concretize"
path = "fuzz_targets/component_concretize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "component_walks"
path = "fuzz_targets/component_walks.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dwarf_invariant"
path = "fuzz_targets/dwarf_invariant.rs"
test = false
doc = false
bench = false
